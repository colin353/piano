[project]
name = "piano-scorer"
version = "0.1.0"
description = "Scoring harness: compares piano synth renders against Steinway reference samples"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "frechet-audio-distance>=0.3.4",
]

[project.optional-dependencies]
# Heavyweight semantic-embedding term (CLAP). Off by default; the core
# metric is spectral/partial feature distance.
embed = ["torch>=2.2", "transformers>=4.40"]

[project.scripts]
piano-score = "piano_scorer.score:main"
piano-plot = "piano_scorer.plots:main"
piano-calibrate = "piano_scorer.calibrate:main"
piano-optimize = "piano_scorer.optimize:main"
piano-fad = "piano_scorer.fad:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piano_scorer"]
